<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>LIVRIAL — Tournée du jour</title>
  <link rel="icon" href="/images/atrial-logo.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="/images/atrial-logo.jpeg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4BBFBF">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { background: var(--canvas); }

    /* FAB zone — footer naturel dans le layout flex */
    .fab-zone {
      display: flex; justify-content: center; gap: 12px;
      padding: 12px 16px 20px; flex-shrink: 0;
      background: var(--canvas);
      border-top: 1px solid var(--line);
    }

    /* Onglets Liste / Itinéraire */
    .lv-tabs {
      background: var(--bg); border-bottom: 1px solid var(--line);
      display: flex; padding: 0 16px; flex-shrink: 0;
    }
    .lv-tab {
      flex: 1; padding: 12px 0; border: none;
      border-bottom: 2px solid transparent; background: none;
      font: 600 13px 'Inter', sans-serif; color: var(--ink-mute); cursor: pointer;
    }
    .lv-tab.active { border-bottom-color: var(--turquoise); color: var(--turquoise); font-weight: 700; }

    /* Feuille de route */
    .route-panel { flex: 1; overflow-y: auto; padding: 12px 16px 16px; display: none; }
    .route-panel.active { display: block; }

    .route-summary {
      background: var(--side-bg); color: #fff; border-radius: 14px;
      padding: 14px 16px; display: flex; gap: 22px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .rs-item { display: flex; flex-direction: column; gap: 2px; }
    .rs-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; opacity: .7; }
    .rs-value { font-size: 18px; font-weight: 800; line-height: 1; }

    .route-leg {
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 14px; margin-bottom: 10px; overflow: hidden;
    }
    .route-leg-head {
      padding: 12px 14px; display: flex; align-items: center; gap: 12px;
      cursor: pointer; background: var(--bg);
    }
    .rl-num {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      background: var(--turquoise); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
    }
    .rl-body { flex: 1; min-width: 0; }
    .rl-name { font-size: 13.5px; font-weight: 700; }
    .rl-meta { font-size: 11.5px; color: var(--ink-mute); margin-top: 2px; }
    .rl-chev { color: var(--ink-mute); font-size: 15px; flex-shrink: 0; }

    .route-steps { display: none; border-top: 1px solid var(--line); padding: 4px 0; }
    .route-leg.open .route-steps { display: block; }
    .route-leg.open .rl-chev { transform: rotate(90deg); }
    .route-step {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 9px 14px; font-size: 13px; line-height: 1.45;
    }
    .route-step + .route-step { border-top: 1px solid var(--line-soft); }
    .rs-icon { font-size: 15px; width: 20px; flex-shrink: 0; text-align: center; }
    .rs-dist { font-size: 11px; color: var(--ink-mute); margin-top: 2px; }

    @media print {
      .map-container, .fab-zone, .lv-tabs,
      .stop-sheet-overlay, .stop-sheet { display: none !important; }
      .livreur-layout { max-width: 100%; height: auto; overflow: visible; }
      .stops-list { overflow: visible; }
      .route-panel { display: block !important; overflow: visible; }
      .route-steps { display: block !important; }
      .stop-card { cursor: default; }
      body { background: #fff; }
    }
  </style>
</head>
<body>

<div class="livreur-layout">

  <!-- HEADER -->
  <header class="livreur-header">
    <div class="brand-left">
      <img src="/images/atrial-logo.jpeg" alt="Atrial">
      <div class="brand-meta">
        <div class="role-label">LIVREUR</div>
      </div>
    </div>
    <div class="brand-right">
      <div class="app-name">LIVR<span>I</span>AL</div>
      <div class="today-date" id="today-date"></div>
      <button onclick="logout()" style="margin-left:10px;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--canvas);font:600 12px 'Inter',sans-serif;color:var(--ink-soft);cursor:pointer;">Déconnexion</button>
    </div>
  </header>

  <!-- SUMMARY STRIP -->
  <div class="summary-strip">
    <div class="sum-item">
      <div class="sum-label">Total</div>
      <div class="sum-value" id="sum-total"><em>—</em></div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Livrés</div>
      <div class="sum-value" id="sum-done"><em>—</em></div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Restants</div>
      <div class="sum-value" id="sum-remaining"><em>—</em></div>
    </div>
  </div>

  <!-- MAP -->
  <div class="map-container">
    <div id="livreur-map"></div>
  </div>

  <!-- ONGLETS -->
  <div class="lv-tabs">
    <button class="lv-tab active" id="lv-tab-liste" onclick="switchLivreurTab('liste')">Liste des stops</button>
    <button class="lv-tab" id="lv-tab-route" onclick="switchLivreurTab('route')">Itinéraire</button>
  </div>

  <!-- STOPS LIST -->
  <div class="stops-list" id="stops-list">
    <div style="text-align:center;padding:40px 20px;color:var(--ink-mute);">
      Chargement de la tournée…
    </div>
  </div>

  <!-- FEUILLE DE ROUTE -->
  <div class="route-panel" id="route-panel">
    <div style="text-align:center;padding:40px 20px;color:var(--ink-mute);">
      Chargement de l'itinéraire…
    </div>
  </div>

  <!-- FAB ZONE — dans le layout pour éviter le chevauchement -->
  <div class="fab-zone">
    <button class="fab" id="btn-optimize" style="background:var(--turquoise);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.15)" onclick="optimizeRoute()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
        <path d="M3 12h18M3 6h18M3 18h18" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      Optimiser l'itinéraire
    </button>
    <button class="fab" style="background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.1)" onclick="window.print()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
        <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <rect x="6" y="14" width="12" height="8" rx="1" stroke="currentColor" stroke-width="2"/>
      </svg>
      Imprimer
    </button>
  </div>

</div>

<!-- STOP DETAIL SHEET -->
<div class="stop-sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="stop-sheet" id="stop-sheet">
  <div class="sheet-grabber"></div>
  <div class="sheet-title" id="sheet-title"></div>
  <div class="sheet-sub" id="sheet-affaire"></div>

  <div class="sheet-detail-row">
    <div class="label">Adresse</div>
    <div id="sheet-adresse"></div>
  </div>
  <div class="sheet-detail-row">
    <div class="label">Téléphone</div>
    <div id="sheet-tel"></div>
  </div>
  <div class="sheet-detail-row">
    <div class="label">Statut actuel</div>
    <div id="sheet-statut-current"></div>
  </div>
  <!-- Règlement lu sur l'ARC : le solde s'encaisse à la livraison -->
  <div class="sheet-detail-row" id="sheet-reglement-row" style="display:none">
    <div class="label">Règlement</div>
    <div id="sheet-reglement"></div>
  </div>

  <!-- Info magasin : colis + emplacement + commentaire -->
  <div id="sheet-magasin-info"></div>

  <!-- Checkbox confirmation colis -->
  <div id="sheet-colis-confirm" style="display:none;margin:14px 0;background:var(--warn-soft);border-radius:12px;padding:12px 14px;">
    <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:14px;font-weight:600;color:#8A5A12">
      <input type="checkbox" id="cb-colis-confirme" style="width:18px;height:18px;margin-top:1px;flex-shrink:0;accent-color:var(--turquoise)" onchange="onColisCheckChange()">
      <span id="cb-colis-label">J'ai bien pris tous les colis</span>
    </label>
  </div>

  <!-- Phrase à trous : sert de validation de la livraison -->
  <div id="sheet-colis-livres" style="display:none;margin:14px 0;background:var(--canvas);border-radius:12px;padding:14px;">
    <!-- Rappel de ce que le magasin a préparé -->
    <div id="colis-livres-prepare" style="display:none;font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)"></div>

    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:15px;font-weight:600;color:var(--ink)">
      <span>J'ai livré</span>
      <input type="number" id="in-colis-livres" min="0" inputmode="numeric" placeholder="—"
        style="width:86px;height:46px;border-radius:12px;border:1px solid var(--line);text-align:center;font:800 18px 'Inter',sans-serif;color:var(--turquoise-dark);background:var(--bg);outline:none"
        oninput="onColisLivresInput()">
      <span>colis<span id="colis-livres-attendu"></span>.</span>
    </div>
    <div id="colis-livres-ecart" style="display:none;margin-top:8px;font-size:12.5px;font-weight:600;color:#8A5A12;background:var(--warn-soft);border-radius:8px;padding:6px 10px"></div>
    <div id="colis-livres-requis" style="display:none;margin-top:8px;font-size:12.5px;color:var(--ink-mute)">
      Renseignez ce nombre pour pouvoir valider la livraison.
    </div>
  </div>

  <div class="status-actions" id="status-actions"></div>
</div>

<!-- PHOTO MODAL -->
<div class="stop-sheet-overlay" id="photo-overlay" onclick="closePhotoModal()"></div>
<div class="stop-sheet" id="photo-sheet">
  <div class="sheet-grabber"></div>
  <div class="sheet-title" style="margin-bottom:14px">Photos du colissage</div>
  <img id="photo-img" src="" alt="Photo du colissage"
    style="width:100%;border-radius:12px;display:block;object-fit:contain;max-height:55vh;">
  <!-- Navigation galerie -->
  <div id="photo-nav" style="display:none;justify-content:space-between;align-items:center;margin-top:10px;gap:8px">
    <button id="photo-prev" onclick="photoNavPrev()"
      style="width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--canvas);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;">‹</button>
    <span id="photo-nav-label" style="font-size:13px;color:var(--ink-mute);font-weight:600"></span>
    <button id="photo-next" onclick="photoNavNext()"
      style="width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--canvas);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;">›</button>
  </div>
  <div id="photo-notice"
    style="margin-top:8px;font-size:12px;color:var(--ink-mute);text-align:center;"></div>
  <button onclick="closePhotoModal()"
    style="margin-top:14px;width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--canvas);font:600 14px 'Inter',sans-serif;color:var(--ink);cursor:pointer;">
    Fermer
  </button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/livreur.js"></script>
</body>
</html>
